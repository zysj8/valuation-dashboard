name: Build
on:
  push:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: pip install pandas jinja2

      - name: Run
        run: python main.py

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@qq.com"
          git add index.html
          git commit -m "update" || true
          git push
