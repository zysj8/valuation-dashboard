name: 自动更新指数温度
on:
  schedule:
    - cron: "0 23 * * *"  # 每天早上7点（UTC时间23点）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install requests pandas jinja2
      - name: Run crawler
        run: python main.py
      - name: Commit changes
        run: |
          git config --global user.name "Auto"
          git config --global user.email "auto@example.com"
          git add index.html
          git commit -m "Auto update $(date '+%Y-%m-%d %H:%M')"
          git push
